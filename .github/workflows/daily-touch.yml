name: Daily Touch (Senin-Kamis, 1x sehari)

on:
  schedule:
    # Target 04:00 WIB = 21:00 UTC hari sebelumnya (WIB = UTC+7).
    # Dijalankan 30 menit lebih awal (20:30 UTC = 03:30 WIB) sebagai buffer
    # karena GitHub schedule sering delay 10 menit - 2 jam saat load tinggi.
    # 0-3 UTC (Min Sen Sel Rab) = 1-4 WIB (Sen Sel Rab Kam).
    - cron: "30 20 * * 0-3"
  workflow_dispatch: # tombol Run workflow manual untuk test

env:
  TZ: Asia/Jakarta

permissions:
  contents: write

concurrency:
  group: daily-touch
  cancel-in-progress: false

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log waktu mulai
        run: |
          echo "Jadwal target: 04:00 WIB (cron 20:30 UTC + buffer delay GitHub)"
          echo "Waktu lokal (WIB):"
          date
          echo "Waktu UTC:"
          date -u

      - name: Sentuh 1 baris + push (1 commit)
        run: |
          set -e
          git config user.name "buzzlightyear-perfect"
          git config user.email "bhaskorou@gmail.com"

          TARGET="src/data/experience.js"

          # Pesan acak agar tidak monoton
          MSGS=(
            "chore: refresh data timestamp [skip ci]"
            "docs: sync activity timestamp [skip ci]"
            "maintenance: minor data touch [skip ci]"
            "chore: daily data sync [skip ci]"
          )

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # Hapus baris lastSync lama (jika ada), lalu append 1 baris baru.
          # Aman: hanya export const tambahan, tidak mengubah data existing.
          grep -v "export const lastSync" "$TARGET" > "$TARGET.tmp" || true
          mv "$TARGET.tmp" "$TARGET"
          echo "" >> "$TARGET"
          echo "export const lastSync = \"$NOW\";" >> "$TARGET"

          MSG=${MSGS[$((RANDOM % ${#MSGS[@]}))]}
          git add "$TARGET"
          # Skip jika tidak ada perubahan (misal dijalankan 2x dalam 1 menit)
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan, skip push."
            exit 0
          fi
          git commit -m "$MSG"

          # Sinkron dengan remote dulu agar push tidak ditolak (non-fast-forward).
          # --autostash agar aman jika ada perubahan lokal tak terduga.
          # Tanpa '|| true' supaya kegagalan rebase terlihat sebagai gagal di log.
          git pull --rebase --autostash origin main

          # Retry push 3x untuk tahan terhadap race / gangguan jaringan sesaat.
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push berhasil pada percobaan ke-$i."
              break
            fi
            echo "Push percobaan ke-$i gagal, coba lagi dalam 10 detik..."
            sleep 10
            git pull --rebase --autostash origin main
            if [ "$i" -eq 3 ]; then
              echo "Push gagal 3x, keluar dengan error."
              exit 1
            fi
          done

          echo "Selesai pada:"
          date
          date -u
